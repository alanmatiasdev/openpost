name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.11"

jobs:
  quality:
    name: Contracts and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Check generated contracts and repository policy
        run: |
          bun run check:build-graph
          bun run check:mcp-registry
          bun run check:docs
          bun run check:release-version
          bun run check:app-routes
          bun run check:legal-policy
          bun run check:changelog
          bun run check:social-images
          bun run check:ui-consistency
          bun run check:contracts
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(find backend cli -path '*/.devenv' -prune -o -type f -name '*.go' -exec gofmt -l {} +)
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          working-directory: backend
          args: --build-tags dev ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          working-directory: cli
          args: ./...
      - name: Check Svelte projects
        run: |
          bun run --filter @openpost/web lint
          bun run --filter @openpost/web check
          bun run --filter @openpost/site check

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run tests without embedding frontend assets
        working-directory: backend
        run: go test -tags dev -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.out
          fail_ci_if_error: false

  backend-race:
    name: Backend race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run race tests without embedding frontend assets
        working-directory: backend
        run: go test -tags dev -race ./...

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run --filter @openpost/web test
      - run: bun run --filter @openpost/video-project test
      - run: bun run verify:frontend-build-cache -- --keep-output
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-public-${{ github.sha }}
          path: backend/cmd/openpost/public
          if-no-files-found: error
          retention-days: 14

  sites:
    name: Marketing and docs builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run marketing:build
      - run: bun run docs:build

  browser:
    name: Browser suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Install deterministic media fixture tooling
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Run browser suites one at a time
        run: |
          bun run test:e2e
          bun run test:e2e:app
          bun run test:e2e:docs

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
      - run: bun install --frozen-lockfile
      - run: scripts/security-check.sh

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - working-directory: cli
        run: |
          go build ./...
          go test ./...

  image:
    name: Production image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive the exact candidate release manifest
        id: manifest
        shell: bash
        run: |
          latest_tag="$(git for-each-ref --count=1 --sort=-version:refname --format='%(refname:short)' 'refs/tags/v*')"
          [[ -n "$latest_tag" ]]
          bun scripts/release-manifest.mjs create \
            --changelog CHANGELOG.md \
            --latest-tag "$latest_tag" \
            --revision "$GITHUB_SHA" \
            --output release-manifest.json
          version="$(jq -er .version release-manifest.json)"
          revision="$(jq -er .revision release-manifest.json)"
          [[ "$revision" == "$GITHUB_SHA" ]]
          manifest_sha256="$(openssl dgst -sha256 -r release-manifest.json | awk '{print $1}')"
          {
            echo "version=$version"
            echo "sha256=$manifest_sha256"
            echo "base64=$(base64 -w0 release-manifest.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Build the immutable candidate once
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          docker buildx build \
            --load \
            --file docker/Dockerfile \
            --tag "$image" \
            --build-arg VERSION="${{ steps.manifest.outputs.version }}" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg RELEASE_MANIFEST_B64="${{ steps.manifest.outputs.base64 }}" \
            --build-arg RELEASE_MANIFEST_SHA256="${{ steps.manifest.outputs.sha256 }}" \
            --cache-from type=gha,scope=openpost-production \
            --cache-to type=gha,mode=max,scope=openpost-production \
            .
          scripts/smoke-production-image.sh \
            "$image" \
            "$GITHUB_SHA" \
            "${{ steps.manifest.outputs.version }}" \
            release-manifest.json
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            docker push "$image"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 14

  release-candidate:
    name: Release Candidate
    if: always()
    needs:
      [
        quality,
        backend,
        backend-race,
        frontend,
        sites,
        browser,
        security,
        cli,
        image,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete matrix
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf 'Job results: %s\n' "$RESULTS"
          [[ "$RESULTS" != *failure* && "$RESULTS" != *cancelled* && "$RESULTS" != *skipped* ]]
